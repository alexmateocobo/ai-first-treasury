<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AI-first treasury: ten processes with agent profiles</title>
<style>
  :root { --blue:#3070B3; --blue-dark:#14519A; --navy:#072140; --blue-50:#F0F5FB; --blue-100:#DDE8F5; --blue-300:#8EB2DC;
    --orange:#E37222; --orange-50:#FDF2EA; --ok:#1D9E75; --text:#15202B; --muted:#5B6773; --line:#DCE1E6; --line-strong:#BCC5CE; --bg:#F4F6F8;
    --font:"TUM Neue Helvetica","Helvetica Neue",Helvetica,Arial,sans-serif; }
  * { box-sizing:border-box; margin:0; padding:0; }
  html, body { height:100%; }
  body { font-family:var(--font); color:var(--text); background:var(--bg); display:flex; flex-direction:column; -webkit-font-smoothing:antialiased; }
  button { font-family:inherit; }

  /* Navy band */
  .top { background:var(--navy); color:#fff; padding:14px 28px; display:flex; justify-content:space-between; align-items:flex-end; gap:24px; flex-shrink:0; }
  .top > div:first-child { min-width:0; }
  .eyebrow { font-size:11.5px; font-weight:700; letter-spacing:1.2px; text-transform:uppercase; color:var(--blue-300); margin-bottom:6px; }
  .top h1 { font-size:26px; font-weight:700; letter-spacing:-.3px; line-height:1.15; }
  .top { height:124px; align-items:center; }
  .top p { font-size:15px; line-height:1.35; color:#C9D6E6; margin-top:4px; height:2.7em; overflow:hidden; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; }
  .right { display:flex; flex-direction:column; align-items:flex-end; gap:12px; flex-shrink:0; }
  .logos { display:flex; align-items:center; gap:18px; }
  .logos img { display:block; }
  .logos .tum { height:26px; }
  .logos .sap { height:30px; }
  .logos .sep { width:1px; height:26px; background:rgba(255,255,255,.3); }
  .controls { display:flex; gap:8px; align-items:center; flex-shrink:0; }
  .seg { display:flex; border:1px solid rgba(255,255,255,.35); }
  .seg button { border:0; background:transparent; color:#C9D6E6; padding:9px 14px; font-size:14px; cursor:pointer; }
  .seg button.sel { background:#fff; color:var(--navy); font-weight:700; }
  .seg button:disabled { cursor:default; opacity:.6; }
  .btn { padding:9px 16px; font-size:14px; font-weight:700; border:1px solid rgba(255,255,255,.45); background:transparent; color:#fff; cursor:pointer; }
  .btn:hover:not(:disabled) { background:rgba(255,255,255,.08); }
  .btn.run { background:var(--orange); border-color:var(--orange); min-width:116px; }
  .btn.run:hover:not(:disabled) { background:#C9611A; }
  .btn:disabled { opacity:.45; cursor:default; }

  /* Process navigation (chevrons) */
  .procnav { background:#fff; border-bottom:1px solid var(--line); padding:10px 28px 12px; display:grid; grid-template-columns:repeat(10, minmax(0,1fr)); column-gap:4px; row-gap:4px; flex-shrink:0; }
  .area-h, .chev { --pt:14px; clip-path:polygon(0 0, calc(100% - var(--pt)) 0, 100% 50%, calc(100% - var(--pt)) 100%, 0 100%, var(--pt) 50%);
    display:flex; align-items:center; justify-content:center; border:0; cursor:pointer; text-align:center; background:#E9EDF1; color:var(--muted);
    padding:0 calc(var(--pt) + 6px) 0 calc(var(--pt) + 10px); transition:background .15s, color .15s; }
  .area-h.first, .chev.first { clip-path:polygon(0 0, calc(100% - var(--pt)) 0, 100% 50%, calc(100% - var(--pt)) 100%, 0 100%); padding-left:14px; }
  .area-h { height:36px; font-size:12px; font-weight:700; letter-spacing:1px; text-transform:uppercase; }
  .chev { height:36px; font-size:13.5px; line-height:1.15; gap:7px; }
  .chev .n { font-size:11px; font-weight:700; opacity:.7; }
  .area-h:not(#area-post), .chev:not(#chev-rep) { margin-right:calc(-1 * var(--pt)); }
  .area-h:hover:not(:disabled), .chev:hover:not(:disabled) { background:#DDE3E9; }
  .area-h.on, .chev.on { background:var(--navy); color:#fff; }
  .area-h.on:hover:not(:disabled), .chev.on:hover:not(:disabled) { background:#0E3260; }
  .chev.sel, .chev.sel:hover:not(:disabled) { background:var(--blue); color:#fff; font-weight:700; }
  .chev.sel .n { opacity:.9; }
  .area-h:disabled, .chev:disabled { cursor:default; }

  /* Stage */
  .stage { flex:1; min-height:0; display:grid; grid-template-columns:minmax(0,1fr) 400px; grid-template-rows:auto minmax(0,1fr); gap:14px; padding:14px 28px 18px; }
  .stage .diagram { grid-column:1; grid-row:1; }
  .stage .step { grid-column:1; grid-row:2; }
  .stage .side { grid-column:2; grid-row:1 / span 2; display:flex; flex-direction:column; gap:14px; min-height:0; }
  .side .logbox { flex:0 0 38%; }
  .side .agentbox { flex:1 1 0; }
  .card { background:#fff; border:1px solid var(--line); }
  .diagram { padding:8px; }
  svg { width:100%; display:block; }
  svg text { font-family:var(--font); }
  .arrow { transition:opacity .4s; }
  .arrow.future { opacity:.12; }
  .arrow.done { opacity:.75; }
  .node { transition:opacity .4s; }
  .node.idle { opacity:.3; }
  .node.unused { opacity:.1; }
  g[id^="H-"].node.unused { opacity:.4; }
  g.node.owner { opacity:1 !important; }
  g.owner > rect.box { fill:var(--blue); stroke:var(--blue); }
  g.owner > text { fill:#fff !important; }
  g.owner .icon circle, g.owner .icon path { fill:#fff; }
  .hidden { display:none; }
  .node.active rect.box { stroke:var(--orange) !important; stroke-width:2.4 !important; animation:glow 1s ease-in-out infinite; }
  .node.ping rect.box { stroke:var(--orange) !important; stroke-width:2 !important; }
  @keyframes glow { 50% { stroke-opacity:.3; } }
  .node .check { display:none; }
  .node.done .check { display:inline; }
  .tag { opacity:.3; transition:opacity .3s; }
  .tag.on { opacity:1; }
  .gate .status { opacity:0; transition:opacity .3s; }
  .gate.pass .status.p, .gate.trigger .status.t { opacity:1; }
  .gate.trigger polygon { animation:pulse .8s ease-in-out infinite; transform-box:fill-box; transform-origin:center; }
  @keyframes pulse { 50% { transform:scale(1.6); } }

  /* Step and log */
  .step { padding:18px 28px; display:flex; flex-direction:column; min-height:0; overflow:hidden; }
  .step p { overflow:auto; min-height:0; }
  .step .count { font-size:12px; font-weight:700; letter-spacing:1px; text-transform:uppercase; color:var(--blue); }
  .step h2 { font-size:17px; font-weight:700; color:var(--navy); margin:6px 0 8px; }
  .step p { font-size:15.5px; line-height:1.6; flex:1; color:#34414E; }
  .nav { display:flex; gap:8px; align-items:center; margin-top:12px; flex-wrap:wrap; }
  .nbtn { padding:9px 18px; font-size:14px; font-weight:700; border:1px solid var(--blue); background:#fff; color:var(--blue); cursor:pointer; }
  .nbtn:hover:not(:disabled) { background:var(--blue-50); }
  .nbtn:disabled { opacity:.4; cursor:default; }
  .dots { display:flex; flex-wrap:wrap; gap:5px; margin-left:8px; }
  .dots button { width:28px; height:28px; border:1px solid var(--line-strong); background:#fff; font-size:12px; font-weight:700; color:var(--muted); cursor:pointer; }
  .dots button.seen { background:var(--blue-100); border-color:var(--blue-300); color:var(--navy); }
  .dots button.cur { background:var(--blue); border-color:var(--blue); color:#fff; }
  .logbox { padding:20px 22px; display:flex; flex-direction:column; min-height:0; }
  .agentbox { padding:18px 22px; display:flex; flex-direction:column; min-height:0; }
  .agentbox h3 { font-size:12px; font-weight:700; letter-spacing:1px; text-transform:uppercase; color:var(--muted); padding-bottom:12px; margin-bottom:12px; border-bottom:1px solid var(--line); }
  .agtabs { display:flex; flex-wrap:wrap; gap:6px; margin-bottom:12px; }
  .agtabs button { padding:6px 12px; font-size:13.5px; border:1px solid var(--line-strong); background:#fff; color:var(--text); cursor:pointer; }
  .agtabs button:hover { border-color:var(--blue); }
  .agtabs button.sel { background:var(--blue); border-color:var(--blue); color:#fff; font-weight:700; }
  .agcard { flex:1; min-height:0; overflow:auto; font-size:14.5px; line-height:1.5; color:#34414E; }
  .agcard .empty { color:var(--muted); }
  .ag-head { display:flex; gap:8px; align-items:center; margin-bottom:12px; }
  .ag-head b { display:block; color:var(--navy); font-size:16px; }
  .ag-head span { font-size:13px; color:var(--muted); }
  .ag-head .sw { width:14px; height:14px; flex:0 0 14px; }
  .sw.meta { background:#DDE8F5; border:1px solid #8EB2DC; } .sw.pred { background:#E4E8EC; } .sw.dec { background:#3070B3; } .sw.gen { background:#072140; }
  .ag-here { background:var(--blue-50); border-left:3px solid var(--blue); padding:8px 12px; margin-bottom:12px; font-size:14px; }
  .ag-here em { display:block; font-style:normal; font-size:11.5px; font-weight:700; letter-spacing:1px; text-transform:uppercase; color:var(--blue); margin-bottom:2px; }
  .agcard dl { display:grid; grid-template-columns:110px 1fr; column-gap:0; }
  .agcard dt, .agcard dd { padding:10px 0; border-top:1px solid var(--line); }
  .agcard dt:first-of-type, .agcard dd:first-of-type { border-top:0; padding-top:2px; }
  .agcard dt { font-size:12px; font-weight:700; letter-spacing:.8px; text-transform:uppercase; color:var(--blue); }
  .agcard dd { margin:0; padding-top:12px; }
  .agcard dt { padding-top:13px; }
  .agcard .mem { font-size:12px; font-weight:700; color:var(--navy); margin-right:6px; }
  .code { display:inline-block; font-size:12px; font-weight:700; padding:0 5px; border:1px solid #8C97A3; background:#fff; color:var(--text); line-height:17px; }
  .code.g { border-color:#E37222; color:#A04A10; background:var(--orange-50); }
  .code.e { border-color:#E24B4A; color:#A32D2D; background:#FCEBEB; }
  .node.hl rect.box { stroke:var(--blue-dark) !important; stroke-width:2.4; stroke-dasharray:4 2; }
  .logbox h3 { font-size:12px; font-weight:700; letter-spacing:1px; text-transform:uppercase; color:var(--muted); padding-bottom:12px; margin-bottom:14px; border-bottom:1px solid var(--line); display:flex; justify-content:space-between; }
  .logbox h3 span { text-transform:none; letter-spacing:0; color:var(--navy); font-size:14px; }
  #log { list-style:none; flex:1; min-height:0; overflow:auto; font-size:15px; line-height:1.5; }
  #log li { padding:8px 10px 8px 12px; border-left:3px solid var(--blue); margin-bottom:8px; background:#FAFBFC; }
  #log li.human { border-left-color:var(--orange); background:var(--orange-50); }
  #log li.pass { border-left-color:var(--ok); }
  #log li.past { opacity:.55; }

  /* Legend popover */
  details.legend { position:relative; }
  details.legend summary { list-style:none; }
  details.legend summary::-webkit-details-marker { display:none; }
  details.legend .pop { position:absolute; right:0; top:44px; z-index:5; width:600px; padding:10px 16px 14px; font-size:13px; color:var(--text); box-shadow:0 8px 24px rgba(7,33,64,.18); }
  .legend .row { display:flex; flex-wrap:wrap; gap:6px 18px; margin-top:8px; align-items:center; }
  .legend i { display:inline-block; width:12px; height:12px; vertical-align:-2px; margin-right:6px; }

  @media (max-width:1600px) { .side .logbox { flex-basis:30%; } .ag-here { display:none; } .stage { padding:12px 20px 14px; } .logbox { padding:16px 16px; } }
  @media (max-width:1100px) { .stage { grid-template-columns:1fr; grid-template-rows:auto auto auto; } .stage .step { grid-column:1; } .stage .side { grid-column:1; grid-row:3; } .side .logbox { flex:none; } #log { height:220px; flex:none; } .agcard { max-height:420px; } .top { flex-wrap:wrap; } }
</style>
</head>

    processes:{

      cap:{
        title:"Exposure capture", owners:['fo'],
        desc:"Owner: Front office. Exposures stream in from the ERP and are released by exception, not by workflow.",
        intro:{ title:"Exposure capture at rest", text:{ stp:"Front office owns exposure capture. Orders, receivables and balance sheet items reach the exposure agent as events. A release workflow with dual control is replaced by a tolerance rule the dealer owns.", exc:"Same capture, but the USD sales forecast is revised sharply. Watch gate G1 hold the release until the dealer confirms." } },
        outro:{ title:"Gross exposure released", text:{ stp:"No human action. Exposures arrived, were validated and released; the dealer acted only through the release tolerance.", exc:"One human action: the dealer confirmed the revised forecast at G1. Everything else ran on agents." } },
        steps:[
          { title:"① Stream exposures from the ERP", src:['n-erp'], dst:['n-exp'], arrows:['e1'],
            log:"① ERP sources → Exposure agent: USD sales orders, purchase orders and receivables as exposure events",
            text:{ stp:"Sales orders, purchase orders and open receivables reach the exposure agent as events, already split by entity, currency and planning period. No manual entry, no spreadsheet upload.", exc:"Orders and receivables stream in as exposure events, split by entity, currency and period." } },
          { title:"② Validate against master data", src:['n-exp'], dst:['n-data'], arrows:['e2'],
            log:"② Exposure agent ⇄ Master and market data agent: entity, currency and counterparty validated",
            text:{ stp:"The agent checks entity, currency, counterparty and period against master data and versions every change with an audit trail. A rejected record goes back to its source, not into a queue.", exc:"Validation against master data, every change versioned." } },
          { title:"Read balance sheet exposure", src:['n-erp'], dst:['n-exp'], arrows:['e1'],
            log:"ERP sources → Exposure agent: foreign currency balances and open items at the key date",
            text:{ stp:"For balance sheet risk nothing needs to be keyed: the agent reads foreign currency balances and open items at the key date.", exc:"Balance sheet exposure is read at the key date." } },
          { title:"Release the gross exposure", src:['n-exp'], dst:[], arrows:[],
            gate:{ id:'g1', human:'H-fo', stp:'pass', exc:'trigger', passLog:"G1 passed: forecast change within tolerance, released automatically", trigLog:"G1 triggered: USD forecast revised beyond tolerance, Dealer confirms" },
            log:"Exposure agent: gross exposure position released to exposure assessment",
            text:{ stp:"The forecast change is within the dealer's tolerance, so gate G1 releases the gross exposure automatically. It moves on to exposure assessment.", exc:"The USD revenue forecast moved beyond tolerance. Gate G1 holds the release until the dealer confirms the new figure." } }
        ]
      },

      ass:{
        title:"Exposure assessment", owners:['fo','mo'],
        desc:"Owner: Front office with mid office. Captured exposures are classified, tested for probability and netted before anything is measured.",
        intro:{ title:"From captured exposure to risk", text:{ stp:"Capture tells what came in; assessment tells what it means as risk. Under the exposure policy the treasury risk manager owns (P1), the agent classifies, tests probability, nets and identifies natural hedges and risk components.", exc:"Same assessment, but one USD revenue forecast falls below the probability threshold. Watch where the dealer is pulled in." } },
        outro:{ title:"Net exposure handed over", text:{ stp:"No human action. A net exposure by risk type, with probability and hedgeable components, went to measurement.", exc:"One human action: the dealer excluded the unreliable forecast (E1). The net exposure handed over was smaller as a result." } },
        steps:[
          { title:"Classify by risk type", src:['n-exp'], dst:[], arrows:[], tags:['t-p1'],
            log:"Exposure agent: exposures classified by risk type and exposure type",
            text:{ stp:"Each exposure is tagged by risk type (FX, interest rate, commodity) and exposure type (transaction, translation, economic), as defined in the exposure policy (P1).", exc:"Exposures classified by risk type and exposure type (P1)." } },
          { title:"① Test forecast probability", src:['n-cash'], dst:['n-exp'], arrows:['a1'],
            humans:[{ scen:'exc', human:'H-fo', tag:'t-e1', log:"E1 escalation: USD revenue forecast for one customer segment below the probability threshold, Dealer excludes it" }],
            log:"① Cash and liquidity agent → Exposure agent: history of forecast against actual cash flows",
            text:{ stp:"The agent compares each forecast with the history of forecast against actual cash flows. Only forecasts above the probability threshold count as highly probable, which hedge accounting later relies on.", exc:"One customer segment has repeatedly missed its forecast, so its USD revenue falls below the probability threshold. The agent escalates to the dealer (E1), who excludes it from the hedgeable exposure." } },
          { title:"Net and find natural hedges", src:['n-exp'], dst:[], arrows:[],
            log:"Exposure agent: group net exposure per currency and bucket, natural hedges offset",
            text:{ stp:"Exposures are netted across entities. USD purchases offset part of the USD revenue as a natural hedge, so only the net position needs an instrument.", exc:"Netting across entities; natural hedges offset." } },
          { title:"Identify risk components", src:['n-exp'], dst:[], arrows:[],
            log:"Exposure agent: hedgeable risk components identified",
            text:{ stp:"Where an exposure carries several risks, the agent identifies the separately identifiable and reliably measurable component, such as the EUR/USD spot element of a USD sale.", exc:"Hedgeable risk components identified." } },
          { title:"② Hand the net exposure to measurement", src:['n-exp'], dst:['n-risk'], arrows:['a2'],
            log:"② Exposure agent → Risk analytics agent: net exposure by risk type, probability and bucket",
            text:{ stp:"The net exposure, with risk type, probability and time bucket, goes to risk analytics. The probability keeps updating and later feeds the hedge reassessment at each period end.", exc:"The reduced net exposure goes to risk analytics; the excluded forecast stays under monitoring." } }
        ]
      },

      mea:{
        title:"Measurement", owners:['mo','rc'],
        desc:"Owner: Mid office and risk controlling. Valuation runs continuously; every state is versioned and attested.",
        intro:{ title:"Measurement at rest", text:{ stp:"Mid office and risk controlling own measurement. The risk analytics agent revalues whenever market data or positions change, with the models the risk controller validated (P2), and the control agent attests each version.", exc:"Same run, but the EUR/USD forward curve arrives stale from the feed. Watch where the risk controller is pulled in." } },
        outro:{ title:"Risk position delivered", text:{ stp:"No human action. Model choice stays with the risk controller (P2); a second user release is replaced by the control agent's attestation.", exc:"One human action: the risk controller resolved the stale curve (E2). Valuation then ran on agents." } },
        steps:[
          { title:"① Collect and validate market data", src:['n-data'], dst:['n-risk'], arrows:['m1'],
            humans:[{ scen:'exc', human:'H-rc', tag:'t-e2', log:"E2 escalation: EUR/USD forward curve stale, Risk controller approves the fallback source" }],
            log:"① Master and market data agent → Risk analytics agent: validated rates, curves and volatilities",
            text:{ stp:"The market data agent collects rates, curves and volatilities and checks them for gaps, staleness and outliers before use.", exc:"The EUR/USD forward curve fails the staleness check. The agent escalates to the risk controller (E2), who approves a fallback source." } },
          { title:"Revalue continuously", src:['n-risk'], dst:[], arrows:[], tags:['t-p2'],
            log:"Risk analytics agent: fair values including CVA and DVA updated",
            text:{ stp:"With the models the risk controller validated (P2), the agent recomputes fair values including credit and debit valuation adjustments whenever market data or positions change. No batch run.", exc:"Fair values recomputed on the validated fallback curve (P2)." } },
          { title:"② Version and attest the state", src:['n-risk'], dst:['n-ctrl'], arrows:['m2'],
            log:"② Risk analytics agent → Control and compliance agent: versioned risk state attested",
            text:{ stp:"Every state is versioned and the control agent attests its completeness. This replaces a snapshot released by a second user.", exc:"The state is versioned and attested, with the fallback source recorded." } },
          { title:"Sensitivities and value at risk", src:['n-risk'], dst:[], arrows:[],
            log:"Risk analytics agent: sensitivities and value at risk on demand",
            text:{ stp:"Shifted scenarios and value at risk are computed on demand, with the method, holding period and confidence level the risk controller set.", exc:"Sensitivities and value at risk on demand." } },
          { title:"③ ④ Hand over the risk position", src:['n-risk'], dst:['n-hedge','n-report'], arrows:['m3','m4'],
            log:"③ ④ Risk analytics agent → Hedge proposal agent and Reporting and insight agent: risk position",
            text:{ stp:"Net exposures against existing hedges, with the hedge ratio per bucket, go to the hedge proposal agent ③ and to reporting ④.", exc:"The risk position goes to hedge proposal ③ and to reporting ④." } }
        ]
      },

      hp:{
        title:"Hedge proposal", owners:['gov'],
        desc:"Owner: Head of treasury. Policy is set once; the agent proposes against it, and a human decides only when a proposal departs from it.",
        intro:{ title:"Hedge proposal at rest", text:{ stp:"The Head of treasury owns hedging policy. Hedge policy and target quotas (P3) are standing parameters, so computing the hedge gap is analysis, not a decision. A decision is needed only on deviation from policy (G2).", exc:"Same position, but the agent's proposal departs from the target quota because of its market view. Watch gate G2." } },
        outro:{ title:"Hedge proposed", text:{ stp:"No human action. The Head of treasury acted through policy (P3) and the dealer through the trading mandate (P4).", exc:"One human action: the Head of treasury approved the departure from policy at G2." } },
        steps:[
          { title:"① Receive the risk position", src:['n-risk'], dst:['n-hedge'], arrows:['d1'], tags:['t-p3'],
            log:"① Risk analytics agent → Hedge proposal agent: risk position against target quota",
            text:{ stp:"The risk position arrives at the hedge proposal agent, which holds the hedge policy and target quotas set by the Head of treasury (P3).", exc:"The risk position arrives against policy and quotas (P3)." } },
          { title:"Compute the hedge gap", src:['n-hedge'], dst:[], arrows:[],
            gate:{ id:'g2', human:'H-gov', stp:'pass', exc:'trigger', passLog:"G2 passed: proposal within target quota (P3)", trigLog:"G2 triggered: proposal departs from the target quota, Head of treasury decides" },
            log:"Hedge proposal agent: hedge gap computed per bucket",
            text:{ stp:"The agent compares the actual hedge ratio with the target quota bucket by bucket, continuously. The proposal stays inside policy, so G2 does not stop it.", exc:"The agent would underhedge one bucket because of its market view. Departing from the quota is a policy decision, so G2 holds the flow until the Head of treasury approves." } },
          { title:"② Propose the hedge", src:['n-hedge'], dst:['n-exec'], arrows:['d2'], tags:['t-p4'],
            gate:{ id:'g3', human:'H-fo', stp:'pass', exc:'pass', passLog:"G3 passed: within trading mandate (P4)" },
            log:"② Hedge proposal agent → Deal execution agent: sell USD forward, amount and value date",
            text:{ stp:"The agent proposes instrument, amount and value date for the gap: a EUR/USD forward selling USD. It is within the dealer's mandate (P4), so G3 passes without a human.", exc:"The approved proposal goes to execution; within the mandate, G3 passes." } }
        ]
      },

      exe:{
        title:"Execution", owners:['fo'],
        desc:"Owner: Front office. Every trade is limit checked as a hard block, executed competitively and booked with its rationale.",
        intro:{ title:"Execution at rest", text:{ stp:"Front office owns execution. The limit check blocks on every entry path, and every deal carries a link to the exposure and proposal it serves.", exc:"Same trade, but no bank quotes within tolerance on the platform. Watch the dealer step in." } },
        outro:{ title:"Deal executed and booked", text:{ stp:"No human action. The dealer acted through the mandate (P4), the risk controller through limits (P5).", exc:"One human action: the dealer executed by phone after E3. Limit check, booking and rationale stayed automated." } },
        steps:[
          { title:"Build the trade request", src:['n-exec'], dst:[], arrows:[], tags:['t-p4'],
            log:"Deal execution agent: proposal converted into a trade request",
            text:{ stp:"The deal execution agent turns the proposal into a trade request and blocks it by currency pair and value date, within the mandate (P4).", exc:"Proposal converted into a trade request within the mandate (P4)." } },
          { title:"① Limit check as hard block", src:['n-exec'], dst:['n-limit'], arrows:['x1'], tags:['t-p5'],
            log:"① Deal execution agent ⇄ Limit management agent: counterparty headroom confirmed",
            text:{ stp:"Counterparty headroom is checked against the limits risk controlling sets independently (P5). A breach blocks the trade on every entry path, platform or phone.", exc:"Hard limit check against P5: headroom confirmed." } },
          { title:"② Execute on the platform", src:['n-exec'], dst:['n-plat'], arrows:['x2'],
            humans:[{ scen:'exc', human:'H-fo', tag:'t-e3', log:"E3 escalation: no quote within tolerance, Dealer executes by phone" }],
            log:"② Deal execution agent ⇄ Trading platform: request for quote, best quote accepted",
            text:{ stp:"A request for quote goes to several banks; the best quote within tolerance is accepted and the executed trade returns.", exc:"No bank quotes within tolerance. The agent escalates to the dealer (E3), who executes by phone; the agent captures the phone trade." } },
          { title:"Book with the rationale", src:['n-exec'], dst:[], arrows:[],
            log:"Deal execution agent: deal booked with exposure and proposal IDs",
            text:{ stp:"The deal is booked with the exposure and proposal it serves. Every deal carries machine readable intent, not only those later designated as hedges.", exc:"Booked with its exposure and proposal IDs, phone trade included." } },
          { title:"③ ④ Hand over", src:['n-exec'], dst:['n-corr','n-desig'], arrows:['x3','x4'],
            log:"③ ④ Deal execution agent → Correspondence and settlement agent and Eligibility and designation agent: booked deal",
            text:{ stp:"The booked deal goes to the back office for confirmation ③ and, at the same moment, triggers hedge designation ④. Designation does not wait for confirmation.", exc:"The booked deal goes to confirmation ③ and triggers designation ④." } }
        ]
      },

      des:{
        title:"Hedge designation", owners:['fo'],
        desc:"Owner: Front office. Designation is triggered at booking, so the hedge relationship exists from inception.",
        intro:{ title:"From deal to hedge relationship", text:{ stp:"Designating a hedge is a front office decision: it states which exposure the deal hedges and why. Hedge accounting applies only from formal designation and documentation, so the agent prepares it at booking, not after confirmation.", exc:"Same deal, but its value date lies two weeks after the expected revenue date, so critical terms do not match. Watch how the test changes." } },
        outro:{ title:"Hedge relationship designated", text:{ stp:"One human action: the dealer approved the designation at G4. The control agent checked the documentation against the accounting policy.", exc:"Still one human action at G4. The mismatch was handled by the method the risk controller set (P7), and its source of ineffectiveness is documented." } },
        steps:[
          { title:"① Triggered at booking", src:['n-exec'], dst:['n-desig'], arrows:['h1'],
            log:"① Deal execution agent → Eligibility and designation agent: booked EUR/USD forward",
            text:{ stp:"The booked forward arrives as the proposed hedging instrument on the day it was traded.", exc:"The booked forward arrives as the proposed hedging instrument." } },
          { title:"② Hedged item and objective", src:['n-exp'], dst:['n-desig'], arrows:['h2'], tags:['t-p6'],
            log:"② Exposure agent → Eligibility and designation agent: hedged item, hedged risk, risk management objective",
            text:{ stp:"The exposure agent names the hedged item (highly probable USD revenue) and the hedged risk (EUR/USD spot). The risk management objective follows the strategy the dealer maintains (P6).", exc:"Hedged item, hedged risk and risk management objective (P6)." } },
          { title:"Choose the model and check eligibility", src:['n-desig'], dst:[], arrows:[],
            log:"Eligibility and designation agent: cash flow hedge; instrument and item eligible, no overhedge",

function port(s) {
  if (Array.isArray(s)) return s;
  const [side, id, off] = s.split(':'); const n = NODE[id]; const o = +(off || 0);
  if (side === 'R') return [n.x + n.w, n.cy + o];
  if (side === 'L') return [n.x, n.cy + o];
  if (side === 'T') return [n.cx + o, n.y];
  return [n.cx + o, n.y + n.h];
}

  const [col, mk, dash] = KIND[a.kind || 'handoff'];

  p.steps.forEach(s => { [...s.src, ...s.dst].forEach(n => used.add(n)); if (s.gate) used.add(s.gate.human); (s.humans || []).forEach(h => used.add(h.human)); });
  [...used].forEach(id => { const d = NODE[id] && NODE[id].def; if (d) used.add('H-' + d.lane); });
  (p.owners || []).forEach(l => used.add('H-' + l));
  IDLE = Object.keys(NODE).filter(k => used.has(k) && !(CFG.alwaysOn || []).includes(k));
  UNUSED = Object.keys(NODE).filter(k => !used.has(k));
  LANES.forEach(l => $('H-' + l.id).classList.toggle('owner', (p.owners || []).includes(l.id)));
  document.querySelectorAll('[data-proc]').forEach(g => { const pr = g.dataset.proc; g.classList.toggle('hidden', !!pr && !pr.split(' ').includes(PK)); });
}
const pick = (v) => (v && typeof v === 'object' && !Array.isArray(v)) ? v[scen] : v;

function stepEvents(s) {
  const ev = [{ text:s.log, cls:'' }];
  const hum = (s.humans || []).filter(h => !h.scen || h.scen === scen).map(h => ({ text:h.log, cls:'human', human:h.human, tag:h.tag }));
  const gate = [];
  if (s.gate) {
    const mode = s.gate[scen];
    if (mode === 'pass') gate.push({ text:pick(s.gate.passLog), cls:'pass' });
    if (mode === 'trigger') gate.push({ text:pick(s.gate.trigLog), cls:'human', human:s.gate.human });
  }
  return s.humansFirst ? ev.concat(hum, gate) : ev.concat(gate, hum);
}

function setNode(id, st) { const g = $(id); g.classList.remove('idle','active','done','ping','unused'); if (st) g.classList.add(st); else if (UNUSED.includes(id)) g.classList.add('unused'); }
function setArrow(id, st) {
  const { g, p } = ARROW[id]; g.classList.remove('future','done','active'); g.classList.add(st);
  const on = st === 'active';
  p.setAttribute('stroke', on ? '#E37222' : p.dataset.s);
  p.setAttribute('stroke-width', on ? 2.4 : 1.3);
  const mk = 'url(#' + (on ? 'mh' : p.dataset.m) + ')';

}
function clearAll() {
  IDLE.forEach(n => setNode(n, 'idle'));
  UNUSED.forEach(n => setNode(n, 'unused'));
  (CFG.alwaysOn || []).forEach(n => setNode(n, null));
  Object.keys(ARROW).forEach(a => setArrow(a, 'future'));
  document.querySelectorAll('.gate').forEach(g => g.classList.remove('pass','trigger'));
  document.querySelectorAll('.tag').forEach(t => t.classList.remove('on'));

  $('log').innerHTML = ''; tally(0);
}
function tally(n) { $('tally').textContent = 'Human actions: ' + n; }
function addLog(e) {
  $('log').querySelectorAll('li:not(.past)').forEach(li => { if (li.dataset.step !== String(curStep)) li.classList.add('past'); });
  const li = document.createElement('li'); if (e.cls) li.className = e.cls; li.dataset.step = curStep; li.textContent = e.text; $('log').appendChild(li); $('log').scrollTop = $('log').scrollHeight;
}
let curStep = -1, panelPK = null;
function setPanel(i) {
  const S = steps();
  if (i < 0) { $('count').textContent = 'Ready'; $('stitle').textContent = P().intro.title; $('stext').textContent = pick(P().intro.text); }
  else if (i >= S.length) { $('count').textContent = 'Complete'; $('stitle').textContent = P().outro.title; $('stext').textContent = pick(P().outro.text); }
  else { $('count').textContent = 'Step ' + (i + 1) + ' of ' + S.length; $('stitle').textContent = S[i].title; $('stext').textContent = pick(S[i].text); }
  $('dots').querySelectorAll('button').forEach((b, k) => b.className = k === i ? 'cur' : k < i ? 'seen' : '');
  if (curPanel !== i || panelPK !== PK + scen) { curPanel = i; panelPK = PK + scen; agentPinned = false; renderAgents(i); }
  const pi = ALL.indexOf(PK);
  $('prev').disabled = i < 0 && pi === 0; $('next').disabled = i >= S.length && pi === ALL.length - 1;
  $('next').innerHTML = i >= S.length && pi < ALL.length - 1 ? 'Next process &#8594;' : 'Next &#8594;';
  $('prev').innerHTML = i < 0 && pi > 0 ? '&#8592; Previous process' : '&#8592; Back';
}

function renderStatic(i) {
  clearAll();
  const S = steps(); let n = 0;
  for (let k = 0; k <= Math.min(i, S.length - 1); k++) {
    const s = S[k], now = k === i; curStep = k;
    s.arrows.forEach(a => setArrow(a, now ? 'active' : 'done'));
    [...s.src, ...s.dst].forEach(x => setNode(x, now ? 'active' : 'done'));
    if (now && s.gate && s.gate[scen]) $(s.gate.id).classList.add(s.gate[scen]);
    stepEvents(s).forEach(e => { addLog(e); if (e.human) { n++; setNode(e.human, now ? 'active' : 'done'); } if (e.tag && now) $(e.tag).classList.add('on'); });
    if (now) (s.tags || []).forEach(t => $(t).classList.add('on'));
  }
  if (i >= S.length) $('log').querySelectorAll('li').forEach(li => li.classList.remove('past'));
  tally(n); setPanel(i);
}

function cancelled() { return run && run.cancelled; }
function tween(dur, fn) {
  return new Promise((res, rej) => {
    let elapsed = 0, last = performance.now();
    function frame(now) {
      if (cancelled()) return rej('cancel');
      if (!run.paused) elapsed += now - last;
      last = now;
      const p = Math.min(1, elapsed / (dur * speed)); fn(p);
      if (p < 1) requestAnimationFrame(frame); else res();

    requestAnimationFrame(frame);

}
const sleep = ms => tween(ms, () => {});
async function draw(id) {
  setArrow(id, 'active');
  const p = ARROW[id].p, len = p.getTotalLength(), bidi = ARROW[id].def.kind === 'bidi';
  token.setAttribute('visibility','visible');
  const move = f => { const q = p.getPointAtLength(len * f); token.setAttribute('cx', q.x); token.setAttribute('cy', q.y); };
  if (bidi) { await tween(800, f => move(f)); await tween(800, f => move(1 - f)); }
  else { p.style.strokeDasharray = len; p.style.strokeDashoffset = len; await tween(Math.min(1500, 700 + len * 1.2), f => { p.style.strokeDashoffset = len * (1 - f); move(f); }); p.style.strokeDasharray = ''; p.style.strokeDashoffset = ''; }
  token.setAttribute('visibility','hidden');
}
let liveHumans = 0;
async function animateStep(s, i) {
  curStep = i; setPanel(i);
  if (CFG.orchestrator) setNode(CFG.orchestrator, 'ping');
  s.src.forEach(n => setNode(n, 'active'));
  (s.tags || []).forEach(t => $(t).classList.add('on'));
  await sleep(600);
  if (CFG.orchestrator && !s.src.includes(CFG.orchestrator)) setNode(CFG.orchestrator, null);
  for (const a of s.arrows) await draw(a);
  const ev = stepEvents(s);
  addLog(ev[0]);
  if (!s.arrows.length) await sleep(900);
  if (s.gate && s.gate[scen]) $(s.gate.id).classList.add(s.gate[scen]);
  for (const e of ev.slice(1)) {
    addLog(e);
    if (e.human) {
      if (e.tag) $(e.tag).classList.add('on');
      setNode(e.human, 'active'); liveHumans++; tally(liveHumans);
      if (CFG.control && !s.src.includes(CFG.control)) setNode(CFG.control, 'ping');
      await sleep(1900);
      if (CFG.control && !s.src.includes(CFG.control)) setNode(CFG.control, null);
      setNode(e.human, 'done');
    } else await sleep(900);
  }
  s.src.forEach(n => setNode(n, 'done'));
  s.dst.forEach(n => setNode(n, 'active'));
  await sleep(1000);
  s.dst.forEach(n => setNode(n, 'done'));
  s.arrows.forEach(a => setArrow(a, 'done'));
  document.querySelectorAll('.tag.on').forEach(t => t.classList.remove('on'));
  document.querySelectorAll('.gate').forEach(g => g.classList.remove('pass','trigger'));

}
function lock(on) { ['sc-stp','sc-exc'].forEach(b => $(b).disabled = on); NAVBTN.forEach(b => b.disabled = on); $('run').disabled = on; $('pause').disabled = !on; }
async function start() {
  if (run) run.cancelled = true;
  const me = { cancelled:false, paused:false }; run = me;
  clearAll(); liveHumans = 0; lock(true); $('pause').textContent = 'Pause';
  let S = steps();
  try {
    for (;;) {
      for (let i = 0; i < S.length; i++) await animateStep(S[i], i);
      setPanel(S.length); await sleep(2200);
      // continue with the next process, across areas, until the end of Reporting
      const nxt = ALL[ALL.indexOf(PK) + 1];
      if (!nxt) break;
      if (run !== me) return;
      PK = nxt; applyProcess(); buildDots(); clearAll(); liveHumans = 0; tally(0);
      S = steps(); cur = -1; setPanel(-1);
      await sleep(1800);
    }
  }
  catch (e) { if (e !== 'cancel') throw e; return; }
  if (run === me) { run = null; lock(false); $('run').innerHTML = '&#9654; Run again'; cur = S.length; renderStatic(S.length); }
}
function stopRun() { if (run) run.cancelled = true; run = null; lock(false); $('run').innerHTML = '&#9654; Run'; }
function go(i) { stopRun(); cur = Math.max(-1, Math.min(steps().length, i)); renderStatic(cur); }
function buildDots() { $('dots').innerHTML = ''; steps().forEach((s, k) => { const b = document.createElement('button'); b.textContent = k + 1; b.setAttribute('aria-label', 'Step ' + (k + 1)); b.onclick = () => go(k); $('dots').appendChild(b); }); }

$('run').onclick = start;
$('pause').onclick = () => { if (!run) return; run.paused = !run.paused; $('pause').textContent = run.paused ? 'Resume' : 'Pause'; };
$('reset').onclick = () => go(-1);
// Next past the end of a process opens the next process; Back before its start opens the previous one at its end
function stepNext() {
  const pi = ALL.indexOf(PK);
  if (cur >= steps().length) { if (pi < ALL.length - 1) { stopRun(); PK = ALL[pi + 1]; applyProcess(); buildDots(); go(-1); } }
  else go(cur + 1);
}
function stepPrev() {
  const pi = ALL.indexOf(PK);
  if (cur < 0) { if (pi > 0) { stopRun(); PK = ALL[pi - 1]; applyProcess(); buildDots(); go(steps().length); } }
  else go(cur - 1);
}
$('next').onclick = stepNext;
$('prev').onclick = stepPrev;
function pickScen(v) { scen = v; $('sc-stp').classList.toggle('sel', v === 'stp'); $('sc-exc').classList.toggle('sel', v === 'exc'); buildDots(); go(-1); }
$('sc-stp').onclick = () => pickScen('stp');
$('sc-exc').onclick = () => pickScen('exc');
function pickProc(v) { PK = v; applyProcess(); buildDots(); go(-1); }
document.addEventListener('keydown', e => {
  if (e.target.tagName === 'BUTTON' && e.key === ' ') return;
  if (e.key === 'ArrowRight') stepNext();
  else if (e.key === 'ArrowLeft') stepPrev();
});
// Agent profiles: five components (Context, Reasoning, Tools, Actions, Memory)
const PROFILES = {

  'n-limit': { ctx:"Trade requests and revaluations; limits P5 set by risk controlling.", rsn:"Blocks any trade that would breach a limit, on every entry path; escalates breaches to the treasury risk manager.", tools:"Limit engine, counterparty credit exposure model.", act:"Approves or blocks trades and keeps limit utilisation current.", stm:"Current utilisation per counterparty.", ltm:"Utilisation and breach history." },
  'n-risk': { ctx:"Positions and validated market data; models and value at risk parameters P2.", rsn:"Revalues on every change; escalates stale data or a failed model check to the risk controller (E2).", tools:"Pricing models, value at risk engine, scenario generator.", act:"Produces fair values, sensitivities and the risk position for hedge proposal, accounting, limits and reporting.", stm:"The current versioned risk state.", ltm:"Valuation history across all versions." },
  'n-data': { ctx:"Market data feeds and master data sources.", rsn:"Checks for gaps, staleness and outliers; proposes a fallback source when a feed fails.", tools:"Market data interfaces, master data hub.", act:"Delivers validated rates, curves and fixings as events; validates entities and counterparties.", stm:"Today's curve set.", ltm:"Data quality history per source." },
  'n-corr': { ctx:"Booked deals and counterparty confirmations.", rsn:"Matches field by field; escalates breaks to operations (E4); a forced match needs a logged reason.", tools:"Messaging gateway, matching engine.", act:"Sends confirmations, sets the deal status and passes settlement instructions to payments.", stm:"Open confirmations.", ltm:"Break patterns per counterparty." },

  'n-reg': { ctx:"Deal, valuation and payment data; reporting scope P9.", rsn:"Determines what is reportable; corrections and late reports wait for approval at G8; rejections escalate to the treasury accountant (E6).", tools:"Trade repository and authority interfaces.", act:"Compiles and submits reports and reconciles the acknowledgements.", stm:"Open submissions.", ltm:"Submission and rejection history." }
};
const TYPENAME = { meta:'Meta-control agent', pred:'Predictive agent', dec:'Decision/logic agent', gen:'Generative agent' };
const LANENAME = Object.fromEntries(LANES.map(l => [l.id, l.name]));
const NODEDEF = Object.fromEntries(CFG.nodes.map(n => [n.id, n]));
let agentSel = null, agentPinned = false;
function esc(t) { return String(t).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function chips(t) { return esc(t).replace(/\b([PGE])(\d)\b/g, (m, k, d) => '<span class="code ' + k.toLowerCase() + '">' + k + d + '</span>'); }
function agentsFor(i) {

}
function renderAgents(i) {

  $('agtabs').querySelectorAll('button').forEach(b => { b.onclick = () => { agentSel = b.dataset.id; renderAgents(curPanel); }; });

    '<dl>' +

// Fit: give the diagram exactly the width its height allows, the rest goes to the activity log,
// and keep diagram text at a constant on-screen size (matched to the 14px body text)
const fitStyle = document.createElement('style'); document.head.appendChild(fitStyle);
function fit() {
  const st = document.querySelector('.stage');
  const cs = getComputedStyle(st);
  const padX = parseFloat(cs.paddingLeft) + parseFloat(cs.paddingRight);
  const padY = parseFloat(cs.paddingTop) + parseFloat(cs.paddingBottom);
  const gap = parseFloat(cs.columnGap) || 14;
  const CARD = 18;                       // diagram card padding and border, both sides
  const STEP = Math.max(170, Math.min(230, st.clientHeight * 0.3)); // target height of the step box
  let diagW;
  if (window.innerWidth > 1100) {
    const avail = st.clientWidth - padX - gap;
    const targetH = st.clientHeight - padY - gap - STEP - CARD;
    diagW = Math.min(targetH * W / H, avail - 340 - CARD);
    st.style.gridTemplateColumns = Math.round(diagW + CARD) + 'px minmax(340px,1fr)';
  } else {
    st.style.gridTemplateColumns = '';

  svg.style.height = Math.round(diagW * H / W) + 'px';
  const k = diagW / W;
  const fs = (px, max) => Math.min(px / k, max).toFixed(2) + 'px';
  fitStyle.textContent =
    '#svg .lt-name{font-size:' + fs(17, 16) + '}' +
    '#svg .lt-role{font-size:' + fs(13, 12.5) + '}' +
    '#svg .lt-agent{font-size:' + fs(13, 11.8) + '}' +
    '#svg .lt-tag{font-size:' + fs(11, 11) + '}' +
    '#svg .lt-num{font-size:' + fs(13.5, 14) + '}' +
    '#svg .lt-gate{font-size:' + fs(12, 13) + '}';
  layoutLanes(Math.min(17 / k, 16), Math.min(13 / k, 12.5));
}
// Lane labels: wrap to the column width at the current on-screen font size
function wrapWords(text, cls, max) {
  const t = el('text', { class:cls, x:0, y:-999 });
  const words = text.split(' '), lines = []; let cur = '';
  words.forEach(w => { const tryS = cur ? cur + ' ' + w : w; t.textContent = tryS;
    if (t.getComputedTextLength() > max && cur) { lines.push(cur); cur = w; } else cur = tryS; });
  lines.push(cur); t.remove(); return lines;
}
function layoutLanes(nameFs, roleFs) {
  LANES.forEach(l => {
    const g = LANEG[l.id], L = LY[l.id];
    g.querySelectorAll('text, .icon').forEach(e => e.remove());
    const nl = wrapWords(l.name, 'lt-name', LW - 18), rl = wrapWords(l.human, 'lt-role', LW - 32);
    const nh = nameFs * 1.15, rh = roleFs * 1.2, gapH = 4;
    const total = nl.length * nh + gapH + rl.length * rh;
    let y = L.mid - total / 2 + nameFs * 0.85;
    nl.forEach(t => { el('text', { x:12, y, class:'lt-name', 'font-weight':'bold', fill:'#072140' }, g, t); y += nh; });
    y += gapH - nh + rh;
    humanIcon(g, 11, y - roleFs * 0.9, '#5B6773');
