<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="Interactive solution blueprint: ten treasury risk management processes run by a team of agents, with every human control point made explicit.">
<title>AI-first treasury: ten processes with agent profiles</title>
<style>
  :root { --blue:#3070B3; --blue-dark:#14519A; --navy:#072140; --blue-50:#F0F5FB; --blue-100:#DDE8F5; --blue-300:#8EB2DC;
    --orange:#E37222; --orange-dark:#A04A10; --orange-50:#FDF2EA; --red:#E24B4A; --ok:#1D9E75; --text:#15202B; --muted:#5B6773; --line:#DCE1E6; --line-strong:#BCC5CE; --bg:#F4F6F8;
    --font:"TUM Neue Helvetica","Helvetica Neue",Helvetica,Arial,sans-serif; }
  * { box-sizing:border-box; margin:0; padding:0; }
  html, body { height:100%; }
  body { font-family:var(--font); color:var(--text); background:var(--bg); display:flex; flex-direction:column; overflow:hidden; -webkit-font-smoothing:antialiased; }
  button { font-family:inherit; }
  [hidden] { display:none !important; }
  :focus-visible { outline:2px solid var(--orange); outline-offset:2px; }

  /* Navy band: title, playback, logos in one row */
  .top { background:var(--navy); color:#fff; padding:0 20px; min-height:52px; display:flex; align-items:center; gap:16px; flex-shrink:0; }
  .brand { min-width:0; flex:1 1 auto; }
  .eyebrow { font-size:10.5px; font-weight:700; letter-spacing:1.1px; text-transform:uppercase; color:var(--blue-300); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .titleline { display:flex; align-items:baseline; gap:14px; min-width:0; }
  .top h1 { font-size:19px; font-weight:700; letter-spacing:-.2px; line-height:1.2; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; flex-shrink:0; max-width:100%; }
  .top #sub { display:none; font-size:13px; color:#C9D6E6; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; min-width:0; }
  .logos { display:flex; align-items:center; gap:12px; flex-shrink:0; }
  .logos img { display:block; }
  .logos .tum { height:19px; }
  .logos .sap { height:22px; }
  .logos .sep { width:1px; height:20px; background:rgba(255,255,255,.3); }
  .controls { display:flex; gap:6px; align-items:center; flex-shrink:0; }
  .seg { display:flex; border:1px solid rgba(255,255,255,.4); }
  .seg button { border:0; background:transparent; color:#C9D6E6; padding:6px 10px; font-size:13px; cursor:pointer; white-space:nowrap; }
  .seg button[aria-pressed="true"] { background:#fff; color:var(--navy); font-weight:700; }
  .btn { padding:6px 11px; font-size:13px; font-weight:700; border:1px solid rgba(255,255,255,.45); background:transparent; color:#fff; cursor:pointer; white-space:nowrap; line-height:1.25; }
  .btn:hover { background:rgba(255,255,255,.1); }
  .btn[aria-pressed="true"] { background:#fff; color:var(--navy); }
  .btn.run { background:var(--orange); border-color:var(--orange); min-width:96px; }
  .btn.run:hover { background:#C9611A; }
  .btn.run.wait { background:#fff; color:var(--orange-dark); border-color:#fff; animation:beat 1s ease-in-out infinite; }
  .btn b { font-weight:700; background:rgba(255,255,255,.2); padding:0 5px; margin-left:3px; font-size:12px; }
  .btn.ico { padding:6px 8px; display:flex; }
  .btn.ico svg { width:15px; height:15px; display:block; }
  .vsep { width:1px; height:22px; background:rgba(255,255,255,.25); margin:0 3px; }
  @keyframes beat { 50% { box-shadow:0 0 0 4px rgba(227,114,34,.35); } }

  /* Process navigation: area captions over one row of chevrons */
  .procnav { background:#fff; border-bottom:1px solid var(--line); padding:5px 20px 7px; display:grid; grid-template-columns:repeat(10, minmax(0,1fr)); column-gap:4px; row-gap:3px; flex-shrink:0; }
  .area-h { border:0; border-left:2px solid var(--line-strong); background:none; height:14px; padding:0 0 0 7px; font-size:10.5px; font-weight:700; letter-spacing:1px; text-transform:uppercase; color:var(--muted); text-align:left; cursor:pointer; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .area-h.on { color:var(--navy); border-left-color:var(--navy); }
  .chev { --pt:12px; clip-path:polygon(0 0, calc(100% - var(--pt)) 0, 100% 50%, calc(100% - var(--pt)) 100%, 0 100%, var(--pt) 50%);
    display:flex; align-items:center; justify-content:center; gap:6px; border:0; cursor:pointer; text-align:center; background:#E9EDF1; color:var(--muted);
    height:32px; font-size:12.5px; line-height:1.1; padding:0 calc(var(--pt) + 4px) 0 calc(var(--pt) + 8px); transition:background .15s, color .15s; }
  .chev.first { clip-path:polygon(0 0, calc(100% - var(--pt)) 0, 100% 50%, calc(100% - var(--pt)) 100%, 0 100%); padding-left:12px; }
  .chev .n { font-size:10.5px; font-weight:700; opacity:.7; }
  .chev:not(.last) { margin-right:calc(-1 * var(--pt)); }
  .chev:hover { background:#DDE3E9; }
  .chev.on { background:var(--navy); color:#fff; }
  .chev.on:hover { background:#0E3260; }
  .chev.sel, .chev.sel:hover { background:var(--blue); color:#fff; font-weight:700; }
  .chev:focus-visible { outline-offset:-3px; }

  /* Stage: diagram on top at full width, three panels below */
  .stage { flex:1; min-height:0; position:relative; display:grid; grid-template-rows:auto minmax(0,1fr); gap:8px; padding:8px 20px 10px; }
  .card { background:#fff; border:1px solid var(--line); }
  .diagram { padding:4px 6px 0; display:flex; flex-direction:column; align-items:center; min-width:0; }
  .svgwrap { max-width:100%; }
  #svg { display:block; }
  svg text { font-family:var(--font); }
  .bottom { display:grid; grid-template-columns:minmax(0,1.5fr) minmax(0,1fr) minmax(0,1.25fr); gap:8px; min-height:0; }
  .bottom > .card { min-height:0; display:flex; flex-direction:column; padding:11px 16px 12px; overflow:hidden; }

  /* Diagram states */
  .arrow { transition:opacity .4s; }
  .arrow.future { opacity:.3; }
  .arrow.done { opacity:.8; }
  .node { transition:opacity .3s; }
  .node rect.box { transition:fill .25s, stroke .25s; }
  .node .ring { stroke:none; }
  /* An agent that has not acted yet is drawn as an outline in its type colour, so the type stays readable */
  .node.ag.idle rect.box, .node.ag.unused rect.box { fill:#fff; }
  .node.ag.idle text.lt-agent, .node.ag.unused text.lt-agent { fill:#15202B; }
  .node.ag.idle .ikf, .node.ag.unused .ikf { fill:#5B6773; }
  .node.ag.idle .iks, .node.ag.unused .iks { stroke:#5B6773; }
  .node.ag.idle .ib, .node.ag.unused .ib { fill:#fff; }
  .node.unused { opacity:.36; }
  g[id^="H-"].node.unused { opacity:.5; }
  g.node.owner { opacity:1 !important; }
  g.owner > rect.box { fill:var(--blue); stroke:var(--blue); }
  g.owner > text { fill:#fff !important; }
  g.owner .icon circle, g.owner .icon path { fill:#fff; }
  g[id^="H-"].node.active > rect.box { fill:var(--orange) !important; stroke:var(--orange) !important; animation:none; }
  g[id^="H-"].node.active > text { fill:#fff !important; }
  g[id^="H-"].node.active .icon circle, g[id^="H-"].node.active .icon path { fill:#fff; }
  g[id^="H-"].node.wait { cursor:pointer; }
  g[id^="H-"].node.wait > rect.box { animation:lanebeat 1s ease-in-out infinite; }
  @keyframes lanebeat { 50% { fill:#F08A45; } }
  .hidden { display:none; }
  .node.active rect.box { stroke:var(--orange) !important; stroke-width:2.6 !important; animation:glow 1s ease-in-out infinite; }
  .node.ping rect.box { stroke:var(--orange) !important; stroke-width:2.2 !important; }
  @keyframes glow { 50% { stroke-opacity:.3; } }
  .node .check { display:none; }
  .node.done .check { display:inline; }
  .node.ag, .tag, .gate { cursor:pointer; }
  .node.hl .ring { stroke:var(--blue-dark); stroke-width:1.6; }
  .node:focus { outline:none; }
  .node:focus-visible .ring { stroke:var(--orange); stroke-width:2; }
  .tag { opacity:.45; transition:opacity .3s; }
  .tag.on, .tag.spot { opacity:1; }
  .tag.spot rect { stroke:var(--orange); stroke-width:2.4; }
  .gate .status { opacity:0; transition:opacity .3s; }
  .gate.pass .status.p, .gate.trigger .status.t { opacity:1; }
  .gate.trigger polygon, .gate.spot polygon { animation:pulse .8s ease-in-out infinite; transform-box:fill-box; transform-origin:center; }
  @keyframes pulse { 50% { transform:scale(1.6); } }

  /* Legend strip, always visible under the diagram */
  .legend { align-self:stretch; display:flex; flex-wrap:wrap; gap:2px 13px; align-items:center; padding:4px 6px 5px; margin-top:3px; border-top:1px solid var(--line); font-size:11.5px; color:var(--muted); }
  .legend .lg { display:inline-flex; align-items:center; gap:5px; white-space:nowrap; }
  .legend .lsep { width:1px; height:12px; background:var(--line-strong); }
  .legend .link { margin-left:auto; border:0; background:none; color:var(--blue); font-weight:700; font-size:11.5px; cursor:pointer; }
  .legend .link:hover { text-decoration:underline; }
  .sw { display:inline-block; width:12px; height:12px; flex:0 0 12px; border:1px solid transparent; }
  .sw.meta { background:#DDE8F5; border-color:#8EB2DC; } .sw.pred { background:#E4E8EC; border-color:#8C97A3; } .sw.dec { background:#3070B3; } .sw.gen { background:#072140; } .sw.ext { background:#fff; border:1px dashed #8C97A3; }
  .ln { display:inline-block; width:18px; height:0; border-top:2px solid var(--blue); }
  .ln.feed { border-top:2px dashed var(--ok); } .ln.esc { border-top:2px dashed var(--red); } .ln.act { border-top:3px solid var(--orange); }
  .dia { display:inline-block; width:9px; height:9px; background:var(--orange); transform:rotate(45deg); margin:0 2px; }
  .code { display:inline-block; font-size:11.5px; font-weight:700; padding:0 5px; border:1px solid #8C97A3; background:#fff; color:var(--text); line-height:16px; font-style:normal; }
  .code.g { border-color:var(--orange); color:var(--orange-dark); background:var(--orange-50); }
  .code.e { border-color:var(--red); color:#A32D2D; background:#FCEBEB; }
  .code[data-code] { cursor:pointer; }
  .code[data-code]:hover { box-shadow:0 0 0 2px var(--blue-100); }

  /* Step panel */
  .shead { display:flex; align-items:center; justify-content:space-between; gap:6px 10px; flex-wrap:wrap; }
  .count { font-size:11.5px; font-weight:700; letter-spacing:1px; text-transform:uppercase; color:var(--blue); }
  .count .w { color:var(--orange-dark); }
  .nav { display:flex; gap:6px; align-items:center; }
  .nbtn { padding:5px 12px; font-size:13px; font-weight:700; border:1px solid var(--blue); background:#fff; color:var(--blue); cursor:pointer; white-space:nowrap; }
  .nbtn:hover:not(:disabled) { background:var(--blue-50); }
  .nbtn.pri { background:var(--blue); color:#fff; }
  .nbtn.pri:hover:not(:disabled) { background:var(--blue-dark); }
  .nbtn:disabled { opacity:.4; cursor:default; }
  .dots { display:flex; gap:3px; }
  .dots button { width:22px; height:22px; border:1px solid var(--line-strong); background:#fff; font-size:11px; font-weight:700; color:var(--muted); cursor:pointer; }
  .dots button.seen { background:var(--blue-100); border-color:var(--blue-300); color:var(--navy); }
  .dots button.cur { background:var(--blue); border-color:var(--blue); color:#fff; }
  .dots button.hum { box-shadow:inset 0 -3px 0 var(--orange); }
  .step h2 { font-size:16.5px; font-weight:700; color:var(--navy); margin:8px 0 5px; }
  .step p { font-size:14.5px; line-height:1.5; color:#34414E; flex:1; min-height:0; overflow:auto; }

  /* Activity log with decision cards */
  .bottom h3 { font-size:11.5px; font-weight:700; letter-spacing:1px; text-transform:uppercase; color:var(--muted); padding-bottom:8px; margin-bottom:8px; border-bottom:1px solid var(--line); display:flex; justify-content:space-between; align-items:baseline; gap:8px; white-space:nowrap; }
  #tally { text-transform:none; letter-spacing:0; color:var(--navy); font-size:12.5px; font-weight:400; }
  #tally b { font-size:14px; }
  #log { list-style:none; flex:1; min-height:0; overflow:auto; font-size:13.5px; line-height:1.4; }
  #log li { padding:6px 8px 6px 10px; border-left:3px solid var(--blue); margin-bottom:6px; background:#FAFBFC; }
  #log li .sn { display:inline-block; min-width:17px; height:17px; line-height:17px; text-align:center; font-size:11px; font-weight:700; background:var(--blue-100); color:var(--navy); margin-right:6px; }
  #log li.pass { border-left-color:var(--ok); }
  #log li.human { border-left-color:var(--orange); background:var(--orange-50); }
  #log li.human.wait { box-shadow:0 0 0 1px var(--orange); }
  #log li.past { opacity:.55; }
  .dc-top { display:flex; align-items:center; gap:6px; flex-wrap:wrap; }
  .dc-who { font-weight:700; color:var(--navy); font-size:13px; flex:1; white-space:nowrap; }
  .dc-who span { font-weight:400; color:var(--muted); }
  .dc-btn { padding:4px 10px; font-size:12.5px; font-weight:700; background:var(--orange); border:1px solid var(--orange); color:#fff; cursor:pointer; animation:beat 1s ease-in-out infinite; white-space:nowrap; }
  .dc-btn:hover { background:#C9611A; }
  .dc-ok { font-size:12px; font-weight:700; color:var(--ok); white-space:nowrap; }
  .dc-ask { font-weight:700; color:var(--text); margin-top:3px; }
  .dc-basis { font-size:12.5px; color:#4A5661; margin-top:2px; }
  #log li.human.past .dc-basis { display:none; }

  /* Agent profile */
  .agtabs { display:flex; flex-wrap:wrap; gap:4px; margin-bottom:8px; }
  .agtabs button { padding:3px 9px; font-size:12.5px; border:1px solid var(--line-strong); background:#fff; color:var(--text); cursor:pointer; }
  .agtabs button:hover { border-color:var(--blue); }
  .agtabs button.sel { background:var(--blue); border-color:var(--blue); color:#fff; font-weight:700; }
  .agcard { flex:1; min-height:0; overflow:auto; font-size:13.5px; line-height:1.45; color:#34414E; }
  .agcard .empty { color:var(--muted); }
  .ag-head { display:flex; gap:7px; align-items:center; margin-bottom:6px; font-size:12.5px; color:var(--muted); }
  .agcard dl { display:grid; grid-template-columns:86px 1fr; }
  .agcard dt, .agcard dd { padding:6px 0; border-top:1px solid var(--line); }
  .agcard dt { font-size:11px; font-weight:700; letter-spacing:.8px; text-transform:uppercase; color:var(--blue); padding-top:8px; }
  .agcard dd { margin:0; }
  .agcard .mem { font-size:11.5px; font-weight:700; color:var(--navy); margin-right:6px; }

  /* Covers: overview and summary */
  .cover { position:absolute; inset:0; z-index:4; background:var(--bg); padding:12px 20px 14px; overflow:auto; }
  .cv { display:grid; gap:12px; min-height:100%; }
  .cv.home { grid-template-columns:minmax(0,1.15fr) minmax(0,1fr); }
  .cv.sum { grid-template-columns:minmax(0,1.5fr) minmax(0,1fr); }
  .cv .card { padding:18px 22px; }
  .cv .ey { font-size:11.5px; font-weight:700; letter-spacing:1.1px; text-transform:uppercase; color:var(--blue); }
  .cv h2 { font-size:26px; line-height:1.15; color:var(--navy); margin:6px 0 8px; letter-spacing:-.3px; }
  .cv .lead { font-size:15.5px; line-height:1.5; color:#34414E; max-width:62ch; }
  .stats { display:grid; grid-template-columns:repeat(4, minmax(0,1fr)); gap:8px; margin:14px 0; }
  .stat { border:1px solid var(--line); border-top:3px solid var(--blue); padding:8px 10px; }
  .stat b { display:block; font-size:26px; color:var(--navy); line-height:1.1; }
  .stat span { font-size:12px; color:var(--muted); }
  .how { list-style:none; display:grid; gap:7px; font-size:14px; line-height:1.4; color:#34414E; }
  .how li { display:grid; grid-template-columns:30px 1fr; gap:8px; align-items:start; }
  .how b { color:var(--navy); }
  .cta { display:flex; flex-wrap:wrap; gap:8px; margin-top:16px; }
  .cbtn { padding:9px 16px; font-size:14px; font-weight:700; border:1px solid var(--blue); background:#fff; color:var(--blue); cursor:pointer; }
  .cbtn:hover { background:var(--blue-50); }
  .cbtn.pri { background:var(--orange); border-color:var(--orange); color:#fff; }
  .cbtn.pri:hover { background:#C9611A; }
  .keys { margin-top:14px; font-size:12px; color:var(--muted); line-height:1.9; }
  .keys kbd { font-family:inherit; font-size:11px; font-weight:700; border:1px solid var(--line-strong); border-bottom-width:2px; padding:1px 5px; background:#fff; color:var(--text); margin-right:3px; }
  .keys span { margin-right:12px; white-space:nowrap; }
  .h-area { font-size:11px; font-weight:700; letter-spacing:1px; text-transform:uppercase; color:var(--muted); margin:10px 0 4px; }
  .h-area:first-child { margin-top:0; }
  .h-proc { display:grid; grid-template-columns:26px minmax(0,1fr) auto; gap:8px; align-items:baseline; width:100%; text-align:left; border:0; border-top:1px solid var(--line); background:none; padding:6px 4px; font-size:14px; color:var(--text); cursor:pointer; }
  .h-proc:hover { background:var(--blue-50); }
  .h-proc .n { font-size:11.5px; font-weight:700; color:var(--blue); }
  .h-proc .t { font-weight:700; color:var(--navy); }
  .h-proc .o { font-size:12px; color:var(--muted); white-space:nowrap; }
  .sumtab { width:100%; border-collapse:collapse; font-size:13.5px; margin-top:10px; }
  .sumtab th { text-align:left; font-size:11px; letter-spacing:.8px; text-transform:uppercase; color:var(--muted); padding:5px 8px; border-bottom:2px solid var(--line-strong); white-space:nowrap; }
  .sumtab td { padding:5px 8px; border-bottom:1px solid var(--line); vertical-align:middle; }
  .sumtab td.n { font-size:11.5px; font-weight:700; color:var(--blue); width:26px; }
  .sumtab td.t { font-weight:700; color:var(--navy); }
  .sumtab tbody tr { cursor:pointer; }
  .sumtab tbody tr:hover { background:var(--blue-50); }
  .sumtab .cur { background:var(--orange-50); }
  .sumtab tfoot td { font-weight:700; color:var(--navy); border-bottom:0; border-top:2px solid var(--line-strong); font-size:15px; }
  .sumtab .none { color:var(--muted); }
  .sumtab .code { margin-right:3px; }
  .cnt { display:inline-block; min-width:18px; font-weight:700; color:var(--navy); }
  .cv h4 { font-size:11.5px; font-weight:700; letter-spacing:1px; text-transform:uppercase; color:var(--muted); margin:0 0 6px; }
  .note { font-size:13px; color:#4A5661; line-height:1.45; margin-top:12px; }

  /* Control register drawer */
  .scrim { position:fixed; inset:0; background:rgba(7,33,64,.28); z-index:8; }
  .drawer { position:fixed; top:0; right:0; bottom:0; width:min(480px, 96vw); background:#fff; z-index:9; box-shadow:-8px 0 28px rgba(7,33,64,.22); display:flex; flex-direction:column; }
  .dr-head { background:var(--navy); color:#fff; padding:12px 18px; display:flex; align-items:center; gap:10px; }
  .dr-head h2 { font-size:17px; flex:1; }
  .dr-head .seg button { padding:4px 9px; font-size:12.5px; }
  .dr-x { border:0; background:none; color:#fff; font-size:22px; line-height:1; cursor:pointer; padding:0 4px; }
  .dr-intro { padding:10px 18px; font-size:13px; line-height:1.45; color:#4A5661; border-bottom:1px solid var(--line); }
  .dr-body { flex:1; min-height:0; overflow:auto; padding:4px 18px 18px; }
  .dr-body h3 { font-size:13px; color:var(--navy); margin:14px 0 2px; display:flex; align-items:baseline; gap:8px; }
  .dr-body h3 small { font-weight:400; color:var(--muted); font-size:12px; }
  .dr-body .def { font-size:12.5px; color:var(--muted); margin-bottom:4px; }
  .dr-body ul { list-style:none; }
  .dr-body li { display:grid; grid-template-columns:34px minmax(0,1fr); gap:8px; padding:7px 6px; border-top:1px solid var(--line); font-size:13.5px; line-height:1.35; }
  .dr-body li > .code { align-self:start; text-align:center; margin-top:1px; }
  .dr-body li.sel { background:var(--blue-50); box-shadow:inset 3px 0 0 var(--blue); }
  .dr-body li b { color:var(--navy); }
  .dr-body .own { display:block; font-size:12px; color:var(--muted); }
  .dr-body .where { display:flex; flex-wrap:wrap; gap:4px; margin-top:4px; }
  .dr-body .where button { border:1px solid var(--line-strong); background:#fff; font-size:11.5px; padding:1px 7px; color:var(--blue); cursor:pointer; }
  .dr-body .where button:hover { border-color:var(--blue); background:var(--blue-50); }

  @media (min-width:1500px) { .top #sub { display:block; } }
  @media (min-width:1700px) and (min-height:950px) {
    .step p { font-size:16px; } .step h2 { font-size:19px; } #log { font-size:14.5px; } .agcard { font-size:14.5px; } .legend { font-size:12.5px; }
    .chev { height:36px; font-size:13.5px; } .top { min-height:58px; } .top h1 { font-size:21px; }
  }
  @media (max-height:760px) {
    .top { min-height:46px; } .procnav { padding:3px 20px 5px; row-gap:2px; } .chev { height:30px; }

function esc(t) { return String(t).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function chip(code) { return '<span class="code ' + code[0].toLowerCase() + '" data-code="' + code + '" role="button" tabindex="0" title="' + esc(CONTROLS[code].name) + '">' + code + '</span>'; }
function chips(t) { return esc(t).replace(/\b([PGE]\d)\b/g, (m, c) => CONTROLS[c] ? chip(c) : m); }
function el(tag, attrs, parent, text) { const e = document.createElementNS(NS, tag); for (const k in attrs) e.setAttribute(k, attrs[k]); if (text !== undefined) e.textContent = text; (parent || svg).appendChild(e); return e; }

function renderSummary() {
  const T = { stp:total('stp'), exc:total('exc') }, nSteps = ALL.reduce((a, k) => a + stepsFor(k, 'stp').length, 0);
  const cell = (k, sc) => { const ev = HUM[sc][k]; return '<td' + (sc === scen ? ' class="cur"' : '') + '><span class="cnt">' + ev.length + '</span>' + (ev.length ? ev.map(e => chip(e.code)).join('') : '') + '</td>'; };
  const pl = n => n + ' human action' + (n === 1 ? '' : 's');
  let rows = '';
  ALL.forEach((k, i) => { const p = CFG.processes[k], ps = Object.keys(CONTROLS).filter(c => c[0] === 'P' && CTL[c].procs.includes(k));
    rows += '<tr data-p="' + k + '"><td class="n">' + pad2(i + 1) + '</td><td class="t">' + esc(p.title) + '</td><td>' + (ps.length ? ps.map(chip).join('') : '<span class="none">none</span>') + '</td>' + cell(k, 'stp') + cell(k, 'exc') + '</tr>'; });
  let roles = '';
  LANES.forEach(l => { const ps = Object.keys(CONTROLS).filter(c => c[0] === 'P' && CONTROLS[c].own === l.id);
    const acts = sc => { const ev = []; ALL.forEach(k => HUM[sc][k].forEach(e => { if (e.human === 'H-' + l.id) ev.push(e); })); return ev; };
    const a = acts(scen);
    roles += '<tr><td class="t">' + esc(l.human) + '</td><td>' + (ps.length ? ps.map(chip).join('') : '<span class="none">none</span>') + '</td><td class="cur"><span class="cnt">' + a.length + '</span>' + a.map(e => chip(e.code)).join('') + '</td></tr>'; });
  $('cover').innerHTML = '<div class="cv sum"><div class="card">' +
    '<div class="ey">End to end</div><h2>' + pl(T.stp) + ' straight-through, ' + T.exc + ' with exceptions</h2>' +
    '<p class="lead">Across ' + ALL.length + ' processes and ' + nSteps + ' steps. Everything else runs on agents, inside the parameters humans set in advance.</p>' +
    '<table class="sumtab"><thead><tr><th></th><th>Process</th><th>Parameters in force</th><th>Straight-through</th><th>With exceptions</th></tr></thead><tbody>' + rows + '</tbody>' +
    '<tfoot><tr><td></td><td>Human actions</td><td></td><td>' + T.stp + '</td><td>' + T.exc + '</td></tr></tfoot></table></div>' +
    '<div class="card"><h4>By accountable role · ' + (scen === 'stp' ? 'straight-through' : 'with exceptions') + '</h4>' +
    '<table class="sumtab" id="roletab"><thead><tr><th>Role</th><th>Sets in advance</th><th>Acts</th></tr></thead><tbody>' + roles + '</tbody></table>' +
    '<p class="note">The scenario switch in the header changes the role view. Every code opens the control register; every process row opens that process.</p>' +
    '<div class="cta"><button class="cbtn pri" id="s-chain">&#9654; Replay the full chain</button><button class="cbtn" id="s-reg">Control register</button><button class="cbtn" id="s-home">Overview</button></div></div></div>';
  $('cover').querySelectorAll('.sumtab tbody tr[data-p]').forEach(r => { r.onclick = e => { if (!e.target.closest('.code')) pickProc(r.dataset.p); }; });
  $('roletab').querySelectorAll('tr').forEach(r => { r.style.cursor = 'default'; });
  $('s-chain').onclick = runChain;
  $('s-reg').onclick = () => openReg();
  $('s-home').onclick = showHome;
}

// ---------- Fit ----------
// The diagram takes the full width unless the panels below would drop under a readable height.
function fit() {
  if (window.innerWidth <= 900) { svg.style.width = ''; svg.style.height = ''; return; }
  const st = $('stage'), cs = getComputedStyle(st), pf = parseFloat;
  const padX = pf(cs.paddingLeft) + pf(cs.paddingRight), padY = pf(cs.paddingTop) + pf(cs.paddingBottom), gap = pf(cs.rowGap) || 8;
  const chrome = $('diagram').offsetHeight - svg.getBoundingClientRect().height;   // card padding, border and legend
  const bottomMin = Math.max(176, Math.min(330, st.clientHeight * 0.285));
  const availW = st.clientWidth - padX - 14;
  const availH = st.clientHeight - padY - gap - bottomMin - chrome;
  const w = Math.max(640, Math.min(availW, availH * W / H));
  svg.style.width = Math.floor(w) + 'px'; svg.style.height = Math.floor(w * H / W) + 'px';
}
window.addEventListener('resize', fit);
const HASH0 = location.hash;
applyProcess(); buildDots(); renderStatic(-1);
if (!readHash(HASH0)) setView("home");
fit(); requestAnimationFrame(fit);
</script>
